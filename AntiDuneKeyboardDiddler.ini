# AntiDuneKeyboardDiddler settings
#
# Everything here is optional; delete a line to fall back to its default.

# Case-insensitive substrings matched against running process names. The guard arms
# while any of them is running and disarms when they are all gone.
#
# Dune Awakening runs three: DuneSandbox (launcher), DuneSandbox_BE (BattlEye) and
# DuneSandbox-Win64-Shipping (the game itself). "DuneSandbox" covers all three, so the
# guard is already armed before the game window exists.
WatchProcesses = DuneSandbox

# How often to check whether the game is running, in milliseconds.
IdlePollMilliseconds = 2000

# How often to check the layout while the game is running, in milliseconds.
ArmedPollMilliseconds = 150

# If the game keeps re-adding its layout, do not retry the removal faster than this.
UnloadRetryMilliseconds = 3000

# How long to keep putting your layout back after the intruder is removed. Removing a
# layout drops everything that was using it onto the Windows default input language,
# which is probably not the layout you were actually on, so the desktop needs a moment
# to be pulled back. Raise this if you ever see it settle on the wrong layout.
SettleMilliseconds = 2000

# How often, while the game is running, to check that the rest of the desktop is still
# on your layout and pull back anything that has drifted. Windows opens new windows on
# its default input language, so over a long session things wander onto it even when
# nothing is technically wrong. Cheap when there is nothing to fix.
HoldSweepMilliseconds = 500

# The layout to hold. Leave it blank and the guard works it out from whichever window is in
# front, which is a guess: Windows opens every new window on your default input language and
# drops every thread orphaned by removing a layout onto it too, so a window sitting on that
# default is usually Windows' doing rather than your choice. If your default input language is
# a layout you never actually type in, that guess goes wrong and the guard spreads the wrong
# layout across the desktop. Setting this takes the guess out.
#
# Accepts the input locale identifier as the log and the status window print it, the KLID as it
# appears in the registry, or the layout name:
#
#   PreferredLayout = F0010409
#   PreferredLayout = 00000409
#   PreferredLayout = United States-International
#
# The tray menu writes this for you: "Preferred layout" lists your configured layouts.
PreferredLayout =

# Guard all the time instead of only while the game runs. Useful for testing, or if
# something other than Dune is hijacking your layout. Also on the tray menu.
EnforceAlways = false

# Show a tray balloon when your layout is put back, so the correction is not silent.
Notify = true

# Ask GitHub once, shortly after startup, whether there is a newer release, and show a tray
# balloon if there is. Nothing is downloaded or installed either way - clicking the balloon
# just opens the releases page in your browser. The tray menu can check on demand whether this
# is on or off, so turning it off only removes the automatic check.
CheckForUpdates = true

# Log every individual correction rather than just the notable events.
Verbose = false
